
name: Build and Publish Custom MD

on:
  push:
    branches:
      - custom/mermaid-wrapping-fix
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - "Dockerfile.wrapping-fix"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.wrapping-fix
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/m4trix04/md:wrapping-fix
            ghcr.io/m4trix04/md:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
